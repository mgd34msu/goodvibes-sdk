name: Setup Bun + dependencies
description: Pin Bun, restore its install cache, and run `bun install --frozen-lockfile`.
  THE single setup for every GoodVibes repo. Bun version has one source — the
  bun-version input (default below) — which repos may override with a BUN_VERSION
  repo variable. Cache and frozen-lockfile are always on.

# -----------------------------------------------------------------------------
# Why the default is 1.3.14 and must not go below it
#
# Bun 1.3.10 through 1.3.13 deadlock the module loader after a process has
# CLOSED two or more `node:fs` watch handles. The next module graph the loader
# has to fetch never resolves: the process parks in epoll_wait with an empty
# event loop, zero CPU, no output, and no per-test timeout to catch it — the
# wait happens BETWEEN test files, where bun's per-test budget does not apply.
#
# Reproduction (bun 1.3.10, wedged 12/12 here; 1.3.14 wedged 0/12):
#   preload: 9 x { mkdtemp; fs.watch(dir); watcher.close() }, then run any test
#   file whose import graph is not loaded yet, with CPU affinity constrained
#   (`taskset -c 0,1`). Two closes are enough; one is not. Not closing the
#   handles never wedges, and removing the directory makes no difference.
#   It only reproduces on a constrained CPU count, which is why the suite is
#   green on a 24-core workstation and hung twice on a CI runner.
#
# It cost this repository two full CI cycles: the "Platform matrix (bun)" job
# printed `##[group]test/arch03-error-hierarchy.test.ts:` and then went silent
# until the 15-minute job timeout killed it. arch03 was never the defect — it
# was the first file after `owner-profile-composition-readiness.test.ts`, whose
# nine `composeOwnerProfile`/`dispose` pairs open and close nine watchers.
#
# 1.3.13 is NOT far enough: it still wedged 6/12 on the same reproduction.
# scripts/bun-pin-rule.ts holds every declaration of this version to the one in
# the root package.json's `engines.bun`, so this default cannot drift from it.
# -----------------------------------------------------------------------------
inputs:
  bun-version:
    description: Bun version to pin. Single source of truth for the estate; pass
      a repo variable (vars.BUN_VERSION, wrapped in an expression at the call
      site) to override the default. Expressions cannot appear literally in
      this description — GitHub's template validator evaluates them even here.
    required: false
    default: "1.3.14"

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}
    - name: Restore Bun install cache
      id: bun-cache-restore
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
    - name: Save Bun install cache
      if: always() && steps.bun-cache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
