name: CI

# Per-push CI: the checks that catch a regression in behavior, on every push.
#
#   build         the workspace packages, once; every job below tests these bytes
#   typecheck     the full solution (packages, test/, scripts/, type tests)
#   test          one bun test run of test/*.test.ts, test/integration, test/toolchain
#   secret-scan   gitleaks over the full history
#   daemon-smoke  packs the SDK, composes a daemon from the packed tarballs and
#                 runs one scripted turn through it (scripts/packed-daemon-smoke.ts)
#
# Release-only checks (packaging, attw, publint, install smoke, artifact lane,
# dependency audit, eval gate, the rn/workers/wrangler legs) live in
# release-gates.yml. It runs nightly, on demand, and here before an armed
# release. Generated files (api docs, contract artifacts, api reports, bundle
# budgets, eval baseline, version strings) are rewritten by
# `bun run release:prepare` at the version bump, never checked per push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
# Default to read-only permissions. Individual jobs elevate as needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup # composite, no SHA needed
      - name: Build SDK
        run: bun run build
      - name: Archive workspace package output
        run: tar -czf /tmp/workspace-build-output.tgz packages/*/dist
      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workspace-build-output
          path: /tmp/workspace-build-output.tgz
          # Retained long enough for the by-reference release to restore this
          # exact build (the artifact-integrity handoff in release.yml downloads
          # it by the CI run id and asserts its head SHA == the tagged SHA).
          retention-days: 7
          if-no-files-found: error

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup
      - name: Typecheck the solution
        run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup
      - name: Download workspace package output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: workspace-build-output
          path: /tmp/workspace-build-output
      - name: Restore workspace package output
        run: tar -xzf /tmp/workspace-build-output/workspace-build-output.tgz -C .
      - name: Configure git identity for worktree/orchestration tests
        # The WRFC and orchestration tests make real git commits in temp
        # repositories and rely on ambient git config, as a user machine has.
        run: |
          git config --global user.email "ci@goodvibes.local"
          git config --global user.name "GoodVibes CI"
      - name: Run the test suite
        # scripts/test.ts directly, not the package `test` script, so the
        # `pretest` typecheck does not re-emit over the restored artifact; the
        # typecheck job owns that.
        run: bun scripts/test.ts

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  daemon-smoke:
    name: Packaged daemon smoke (one scripted turn)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Setup Bun + deps (cached)
        uses: ./.github/actions/setup
      - name: Download workspace package output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: workspace-build-output
          path: /tmp/workspace-build-output
      - name: Restore workspace package output
        run: tar -xzf /tmp/workspace-build-output/workspace-build-output.tgz -C .
      - name: Pack, compose a daemon from the tarballs, run one turn
        run: bun run smoke:daemon

  # Release gates for THIS commit, run only when the push would release it.
  # An unarmed push skips this job and auto-release together.
  release-gates:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.RELEASE_ARMED == 'true'
    needs: [build]
    permissions:
      contents: read
    uses: ./.github/workflows/release-gates.yml

  # ---------------------------------------------------------------------------
  # Zero-touch release. Runs only after every job above is green (its `needs`
  # covers all of them, including the release gates), and only for pushes to
  # main. When the release commit's version has no tag yet, it creates the
  # annotated tag at this SHA and dispatches release.yml at that tag with
  # mode=release.
  #
  # Why the dispatch (not just the tag push): a tag pushed with GITHUB_TOKEN does
  # NOT trigger workflows, so the tag alone would never start release.yml. The
  # documented exception is that a workflow_dispatch API call made with
  # GITHUB_TOKEN DOES create a run, so we push the tag (for provenance + the
  # manual redo path) and then explicitly dispatch the release at that tag ref.
  # Idempotent, but not blindly: an already-existing tag is a no-op only when
  # release.yml actually has a run for that tag. A tag with no release run is
  # the tagged-then-dispatch-failed state, and it gets re-dispatched.
  # ---------------------------------------------------------------------------
  auto-release:
    name: Auto-release (tag + dispatch on green)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # RELEASE_ARMED holds the zero-touch release while a version accumulates
    # work across multiple pushes. Unset or any value other than 'true' means
    # CI runs green without tagging or publishing; setting the repo variable
    # to 'true' is the deliberate act that lets the next green push release.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.RELEASE_ARMED == 'true'
    # Every per-push job AND the release gates for this exact commit. The
    # release gates run only on an armed push (job above), so the version this
    # job tags is the version they passed on.
    needs:
      - build
      - typecheck
      - test
      - secret-scan
      - daemon-smoke
      - release-gates
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Read version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Tag the release and dispatch release.yml (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          MANUAL_REDO="gh workflow run release.yml --repo ${REPO} --ref refs/tags/${TAG} -f mode=release -f ref=refs/tags/${TAG}"

          # Dispatch release.yml AT THE TAG REF. A workflow_dispatch API call
          # under GITHUB_TOKEN does create a run (the documented exception to
          # token-driven events not triggering workflows), which is why the tag
          # push alone is not enough.
          #
          # `--ref` is the part that matters: it decides what github.ref and
          # github.sha are for the whole release run. The `-f ref=` INPUT is
          # inert today, since every expression in release.yml that reads
          # inputs.ref short-circuits on mode == 'release' before reaching it.
          # It is passed anyway so the input never carries its "main" default
          # into a release run if one of those expressions is ever reordered.
          dispatch_release() {
            for attempt in 1 2 3 4 5 6 7 8; do
              if gh workflow run release.yml --ref "refs/tags/${TAG}" -f mode=release -f "ref=refs/tags/${TAG}"; then
                echo "Dispatched release.yml for ${TAG} (mode=release)."
                return 0
              fi
              echo "gh workflow run failed (attempt ${attempt}/8); retrying in 7s…" >&2
              sleep 7
            done
            return 1
          }

          # How many release.yml runs exist for this tag, in ANY state. Queued,
          # running, and FAILED all count: this job's question is "was the
          # release ever started", not "did it succeed". A failed run is a
          # visible thing an operator re-runs by hand, whereas a tag with no run
          # at all is invisible, and only the second one is this job's to fix.
          #
          # Two queries because neither alone is sufficient: the server-side
          # `branch` filter is unbounded in history but its tag semantics are
          # not contractual, and the recent-runs scan reads head_branch
          # directly but only sees the last 100 runs. Prints a count, or
          # nothing at all when the API could not answer.
          release_run_count() {
            local filtered scanned
            filtered=$(gh api "repos/${REPO}/actions/workflows/release.yml/runs?branch=${TAG}&per_page=1" \
              --jq '.total_count' 2>/dev/null) || filtered=""
            scanned=$(gh api "repos/${REPO}/actions/workflows/release.yml/runs?per_page=100" \
              --jq "[.workflow_runs[] | select(.head_branch == \"${TAG}\")] | length" 2>/dev/null) || scanned=""
            [[ "$filtered" =~ ^[0-9]+$ ]] || filtered=""
            [[ "$scanned" =~ ^[0-9]+$ ]] || scanned=""
            if [ -z "$filtered" ] && [ -z "$scanned" ]; then
              return 1
            fi
            # The larger of the two, never the sum: a run both queries see must
            # not be reported twice.
            if [ "${filtered:-0}" -ge "${scanned:-0}" ]; then echo "${filtered:-0}"; else echo "${scanned:-0}"; fi
          }

          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}"; then
            # The tag exists (a re-run of this job, a manually pushed tag, or an
            # earlier run that tagged and then failed to dispatch). That is only
            # a no-op if release.yml actually ran for the tag; exiting 0 without
            # checking reported a green "nothing to do" over a release that was
            # never started.
            echo "Tag ${TAG} already exists on origin; checking whether release.yml ran for it."
            COUNT=""
            for attempt in 1 2 3 4 5; do
              if COUNT=$(release_run_count); then
                break
              fi
              COUNT=""
              if [ "$attempt" -lt 5 ]; then
                echo "release.yml run lookup failed (attempt ${attempt}/5); retrying in 7s…" >&2
                sleep 7
              fi
            done
            if [ -z "$COUNT" ]; then
              echo "ERROR: could not determine whether release.yml ever ran for ${TAG}." >&2
              echo "Refusing to report success over an unknown release state. Check the Actions tab," >&2
              echo "and if no release run exists for ${TAG}, run:" >&2
              echo "  ${MANUAL_REDO}" >&2
              exit 1
            fi
            if [ "$COUNT" -gt 0 ]; then
              # Deliberately NOT a claim that the release succeeded. This job
              # only guarantees a release run was started for the tag; the run
              # may have failed, and if it did, re-running it is a human
              # decision, not something to re-dispatch automatically.
              echo "release.yml has ${COUNT} run record(s) for ${TAG}, so the release was started; this job is done."
              echo "That is NOT a statement that the release succeeded. If ${TAG} is not on npm, check the run at"
              echo "  ${GITHUB_SERVER_URL:-https://github.com}/${REPO}/actions/workflows/release.yml"
              echo "and re-run it from the Actions tab, or dispatch a fresh one with:"
              echo "  ${MANUAL_REDO}"
              exit 0
            fi
            echo "Tag ${TAG} exists but NO release.yml run does; re-dispatching." >&2
            if dispatch_release; then
              exit 0
            fi
            echo "ERROR: failed to dispatch release.yml for ${TAG} after 8 attempts." >&2
            echo "Redo it manually with:" >&2
            echo "  ${MANUAL_REDO}" >&2
            exit 1
          fi

          git config user.name "GoodVibes CI"
          git config user.email "ci@goodvibes.local"
          git tag -a "${TAG}" -m "release ${VERSION}" "${SHA}"
          # Push with GITHUB_TOKEN: this does NOT trigger release.yml (token
          # pushes never trigger workflows), which is why we dispatch below.
          git push origin "refs/tags/${TAG}"
          echo "Created and pushed ${TAG} at ${SHA}."
          if dispatch_release; then
            exit 0
          fi
          echo "ERROR: failed to dispatch release.yml for ${TAG} after 8 attempts." >&2
          echo "The tag is pushed; redo the dispatch manually with:" >&2
          echo "  ${MANUAL_REDO}" >&2
          exit 1
