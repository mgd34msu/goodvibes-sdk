name: Public Suffix Drift

# Compares the bundled public-suffix snapshot
# (packages/sdk/src/platform/security/public-suffix.ts) against upstream once a
# week and reports drift as a GitHub issue. It never fails: Mozilla publishes on
# its own schedule, and a stale snapshot only narrows link-validation coverage
# (unknown suffixes fall back to single-label, which is correct for com, dev,
# app and every new gTLD). A red run would block nothing and inform no one.
#
# - drift found: opens the tracking issue, or replaces its body when one is
#   already open, with the script's full report (which suffixes, which
#   direction, and the data-only fix).
# - in sync: closes the tracking issue if one is open.
# - upstream unreachable: a warning annotation; the bundled list is unchanged.

on:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-suffix-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Compare the bundled snapshot against upstream and file the result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          TITLE="Public Suffix List snapshot has drifted from upstream"
          status=0
          bun scripts/check-public-suffix-drift.ts > /tmp/psl-report.txt 2>&1 || status=$?
          cat /tmp/psl-report.txt

          existing=$(gh issue list --repo "$REPO" --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1 || true)

          case "$status" in
            0)
              if [ -n "$existing" ]; then
                gh issue close "$existing" --repo "$REPO" \
                  --comment "The bundled snapshot matches upstream again as of ${RUN_URL}."
              fi
              ;;
            1)
              {
                echo "The weekly drift check found differences between the bundled public-suffix snapshot and upstream."
                echo
                echo "Fix: edit the tables in \`packages/sdk/src/platform/security/public-suffix.ts\` (data only; the module header has the refresh procedure)."
                echo
                echo "Run: ${RUN_URL}"
                echo
                echo '```'
                cat /tmp/psl-report.txt
                echo '```'
              } > /tmp/psl-issue.md
              if [ -n "$existing" ]; then
                gh issue edit "$existing" --repo "$REPO" --body-file /tmp/psl-issue.md
                echo "Updated issue #${existing}."
              else
                gh issue create --repo "$REPO" --title "$TITLE" --body-file /tmp/psl-issue.md
              fi
              ;;
            *)
              echo "::warning::Public-suffix drift check could not reach upstream (exit ${status}); the bundled list is unchanged."
              ;;
          esac
